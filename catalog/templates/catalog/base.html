{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fitness Course Catalog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catalog/styles.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark">FC</span>
                <span>
                    <strong>Fitness Catalog</strong>
                    <small>Каталог фитнес-курсов</small>
                </span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'course_list' %}">Courses</a>
                <a class="nav-action" href="{% url 'add_course' %}">Add course</a>
            </nav>
        </header>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message {{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
